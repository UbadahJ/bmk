# Builds generic release binaries when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Run it by hand (Actions > release > Run workflow) for a dry run: it tests and builds,
# and uploads the archives as workflow artifacts, but doesn't publish a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Empty RUSTFLAGS overrides target-cpu=native in .cargo/config.toml: release
  # binaries have to run on any CPU of their architecture.
  RUSTFLAGS: ""

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install fish
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install fish; else sudo apt-get update && sudo apt-get install -y fish; fi
          fish --version
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.70 --profile minimal
      - run: cargo +1.70 build --release --locked

  build:
    name: build (${{ matrix.target }})
    needs: [test, msrv]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary
        run: |
          bin=target/${{ matrix.target }}/release/bmk
          file "$bin"
          # x86_64 macOS is cross-built on Apple Silicon; it runs only if Rosetta is there.
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "no Rosetta; skipping the run check"; exit 0
          fi
          version=$("$bin" -V)
          echo "$version"
          case $version in *"(generic)"*) ;; *) echo "expected a generic build" >&2; exit 1 ;; esac
          if [ "$RUNNER_OS" = Linux ] && ldd "$bin" 2>/dev/null | grep -q '=>'; then
            echo "expected a static binary" >&2; exit 1
          fi
      - name: Package
        run: |
          name=bmk-${GITHUB_REF_NAME#v}-${{ matrix.target }}
          [ "$GITHUB_REF_TYPE" = tag ] || name=bmk-dev-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/bmk install.sh LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          # The release keeps its own copies; these are only for handing over to that job.
          retention-days: 1

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
